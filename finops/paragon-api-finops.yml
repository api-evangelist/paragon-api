description: >-
  FinOps view of Paragon spend. Paragon is a B2B, contact-sales embedded iPaaS
  with no published per-unit pricing. Cost is an annual platform subscription
  (Pro or Enterprise tier) plus usage that scales primarily on the number of
  Connected Users - the SaaS builder's end customers who have connected an
  integration. Integrations themselves are unlimited across plans, so the dominant
  cost driver is how many of your customers actively use integrations, not how
  many integrations you offer. A build-for-free developer tier and a 14-day trial
  exist for evaluation. Self-hosting (on-premise) on Enterprise shifts some
  infrastructure cost to the customer.
notes: >-
  Per-unit rates are not reconciled here - Paragon does not publish pricing.
  Verify the platform subscription, the Connected-User pricing basis, and any
  overage terms directly with Paragon sales. Note that downstream third-party API
  usage driven through the Proxy API or ActionKit may carry its own costs at those
  providers, separate from Paragon's invoice.
