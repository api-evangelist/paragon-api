meters:
- name: platform_subscription
  description: Annual platform subscription for the Pro or Enterprise plan.
  unit: contract
  aggregation: max
  dimensions:
  - plan
- name: connected_users
  description: Connected Users (end customers with at least one connected integration) that usage scales on.
  unit: users
  aggregation: max
  dimensions:
  - project
  - environment
principles:
- name: Visibility
  description: Track the count of active Connected Users per project/environment, since that is the primary billing driver; watch for growth in connected customers.
- name: Allocation
  description: Map Connected Users to internal customer segments or plans so integration cost can be attributed to the revenue it supports.
- name: Optimization
  description: Deactivate Connected Users who no longer use integrations; consolidate environments; weigh self-hosting (Enterprise) against managed cost at high volume.
- name: Accountability
  description: Assign an owner for the Paragon contract; review Connected-User counts against the subscribed tier and reconcile against Paragon invoices; account separately for downstream provider API costs.
