name: Paragon
kind: company
description: Paragon is an embedded iPaaS that lets SaaS companies build native,
  in-app integrations for their customers. Developers configure integrations, Managed
  Sync pipelines, Workflows, and ActionKit tools in Paragon, then embed them behind
  a Connect Portal so each of their end customers (Connected Users) can authenticate
  their own third-party accounts. Requests are made on behalf of Connected Users
  using a Paragon User Token - an RS256-signed JWT - across a REST Connect/SDK API
  (api.useparagon.com), a Workflows API, an ActionKit tool-calling API for AI agents
  (actionkit.useparagon.com), and a Proxy API (proxy.useparagon.com) that forwards
  requests to third-party providers. Paragon is a B2B, contact-sales product.
